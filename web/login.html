<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agentic Bridge · Iniciar sesión</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script>
  try { var t = localStorage.getItem('ab.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else if (t === 'system') delete document.documentElement.dataset.theme; } catch (e) {}
</script>
<style>
  body { display: grid; place-items: center; min-height: 100%; padding: 16px; }
  .login { width: min(360px, 100%); display: grid; gap: 18px; }
  .login .brand { padding: 0; }
  .login form { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .login label { font-size: 12.5px; color: var(--muted); font-weight: 550; }
  .login .input { height: 40px; font-size: 15px; }
  .login .btn { height: 40px; justify-content: center; font-size: 14px; }
  .login .err { color: var(--bad); font-size: 13px; min-height: 18px; }
  .login .note { color: var(--dim); font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<main class="login">
  <div class="brand"><img src="/logo.svg" alt=""><div class="word"><b>Agentic Bridge</b><span class="tag">Tus sesiones desde cualquier dispositivo</span></div></div>
  <form id="f" autocomplete="on">
    <label for="pw">Contraseña de acceso</label>
    <input id="pw" class="input" type="password" name="password" autocomplete="current-password" required autofocus>
    <button class="btn primary" type="submit" id="go">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="note">Es la contraseña que definiste en Ajustes › Acceso desde el teléfono, en tu PC. Este dispositivo queda con la sesión iniciada por 30 días; puedes cerrarla desde el PC.</p>
</main>
<script>
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go');
    var err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      var res = await fetch('/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok) { location.replace('/'); return; }
      err.textContent = data.error || ('Error ' + res.status);
    } catch (x) { err.textContent = 'No pude conectar con tu PC.'; }
    btn.disabled = false;
  });
</script>
</body>
</html>
